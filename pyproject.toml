[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon"
version = "0.1.0"
description = "Continuously maintained software understanding for AI agents"
requires-python = ">=3.12"

dependencies = [
    "openai==3.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
